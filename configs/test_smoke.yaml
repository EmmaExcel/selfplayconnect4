game:
  rows: 6
  cols: 7

network:
  num_residual_blocks: 2
  num_channels: 32

training:
  num_iterations: 1
  games_per_iteration: 2
  num_simulations: 10
  batch_size: 16
  epochs_per_iteration: 2
  learning_rate: 0.001
  lr_scheduler: cosine
  weight_decay: 0.0001
  replay_buffer_size: 1000
  acceptance_threshold: 0.55

mcts:
  num_simulations: 10
  c_puct: 1.25
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  temperature_threshold_move: 5
  temperature_high: 1.0
  temperature_low: 0.1

opponent_pool:
  save_interval: 1
  pool_game_fraction: 0.5

arena:
  num_games: 2
