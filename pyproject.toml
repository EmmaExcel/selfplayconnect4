[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selfplayconnect4"
version = "0.1.0"
description = "Self-play Connect 4 agent using AlphaZero-lite"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.scripts]
train = "scripts.train:main"
play-cli = "scripts.play_cli:main"
